name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python app
        working-directory: ./testing
        run: |
          python -m compileall portal_server.py
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('portal_server.py'),
              Path('static_portal/index.html')
          ]
          for path in required:
              if not path.exists():
                  raise FileNotFoundError(f'Missing required file: {path}')
          print('Portal files validated successfully.')
          PY

      - name: Build Docker image
        working-directory: ./testing
        run: |
          docker build -t shakeer405/clientwebportal:v${{ github.run_number }} .

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push shakeer405/clientwebportal:v${{ github.run_number }}