name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientwebportal-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: shakeer405/clientwebportal
  IMAGE_TAG: v${{ github.run_number }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and validate files
        working-directory: ./testing
        run: |
          python -m compileall portal_server.py
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('portal_server.py'),
              Path('static_portal/index.html')
          ]
          for path in required:
              if not path.exists():
                  raise FileNotFoundError(f'Missing required file: {path}')
          print('Portal files validated successfully.')
          PY

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ./testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        working-directory: ./testing
        run: |
          python - <<'PY'
          print('Smoke test passed for Python version:', __import__('sys').version.split()[0])
          PY

  build-image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ./testing
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:8000

    steps:
      - name: Production approval gate
        run: echo "This deployment waits for environment approval in GitHub before moving forward."

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} to Kubernetes"
          kubectl set image deployment/clientwebportal clientwebportal=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --record